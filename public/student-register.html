<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | EduTrust Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent: #dbeafe;
            --bg-gradient: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --error: #ef4444;
            --success: #10b981;
            --focus-ring: rgba(37, 99, 235, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 580px;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            background: var(--accent);
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            margin-bottom: 0.75rem;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.4rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
        }

        label span.req {
            color: var(--error);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        input:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .toggle-password {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin-top: 0;
            box-shadow: none;
            width: auto;
        }

        .toggle-password:hover {
            color: var(--primary);
            background-color: transparent;
            transform: none;
        }

        .alert {
            padding: 0.9rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            display: none;
            font-weight: 500;
            line-height: 1.4;
        }

        .alert-error {
            background-color: #fef2f2;
            color: var(--error);
            border: 1px solid #fecaca;
        }

        .alert-success {
            background-color: #ecfdf5;
            color: var(--success);
            border: 1px solid #a7f3d0;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 1.5rem;
            padding: 0.9rem;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button[type="submit"]:disabled {
            opacity: 0.7;
            transform: none;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            margin-top: 1.75rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .card { padding: 1.75rem 1.25rem; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <span class="badge">Student Portal</span>
        <h1>Create Account</h1>
        <p>Register as a student to access your academic dashboard</p>
    </div>

    <div id="alertBox" class="alert" role="alert" aria-live="polite"></div>

    <form id="studentRegisterForm" novalidate>
        <div class="form-grid">
            <div class="form-group">
                <label for="first_name">First Name <span class="req">*</span></label>
                <input type="text" id="first_name" required placeholder="John" autocomplete="given-name">
            </div>

            <div class="form-group">
                <label for="last_name">Last Name <span class="req">*</span></label>
                <input type="text" id="last_name" required placeholder="Doe" autocomplete="family-name">
            </div>

            <div class="form-group full-width">
                <label for="email">Email Address <span class="req">*</span></label>
                <input type="email" id="email" required placeholder="student@school.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="school_code">School Code <span class="req">*</span></label>
                <input type="text" id="school_code" required placeholder="e.g. SCH1024" style="text-transform: uppercase;">
            </div>

            <div class="form-group">
                <label for="current_class">Class / Grade <span class="req">*</span></label>
                <input type="text" id="current_class" required placeholder="e.g. SSS 2, JSS 1">
            </div>

            <div class="form-group full-width">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="+234 800 000 0000" autocomplete="tel">
            </div>

            <div class="form-group full-width">
                <label for="password">Password <span class="req">*</span></label>
                <div class="input-wrapper">
                    <input type="password" id="password" minlength="6" required placeholder="Minimum 6 characters">
                    <button type="button" class="toggle-password" id="togglePassword">Show</button>
                </div>
            </div>
        </div>

        <button type="submit" id="submitBtn">Register as Student</button>
    </form>

    <div class="footer">
        Already registered? <a href="student-login.html">Sign in here</a>
    </div>
</div>

<script>
    const form = document.getElementById("studentRegisterForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");
    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("togglePassword");

    const BASE_URL = "https://edutrust-15ii.onrender.com";

    // Password visibility toggle logic
    togglePasswordBtn.addEventListener("click", () => {
        const isPassword = passwordInput.getAttribute("type") === "password";
        passwordInput.setAttribute("type", isPassword ? "text" : "password");
        togglePasswordBtn.textContent = isPassword ? "Hide" : "Show";
    });

    function showAlert(msg, isError = true) {
        alertBox.textContent = msg;
        alertBox.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
        alertBox.style.display = 'block';
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        // Extract values
        const payload = {
            first_name: document.getElementById("first_name").value.trim(),
            last_name: document.getElementById("last_name").value.trim(),
            email: document.getElementById("email").value.trim().toLowerCase(),
            school_code: document.getElementById("school_code").value.trim().toUpperCase(),
            current_class: document.getElementById("current_class").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            password: document.getElementById("password").value
        };

        // Basic client-side checks
        if (!payload.first_name || !payload.last_name || !payload.email || !payload.school_code || !payload.current_class || !payload.password) {
            showAlert("Please fill in all required fields.", true);
            return;
        }

        if (payload.password.length < 6) {
            showAlert("Password must be at least 6 characters long.", true);
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating Account...";

        try {
            const res = await fetch(`${BASE_URL}/api/students`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const contentType = res.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                throw new Error(`Server returned ${res.status} (${res.statusText}). Check backend setup.`);
            }

            const data = await res.json();
            if (!res.ok) throw new Error(data.message || "Registration failed.");

            showAlert("Registration successful! Redirecting to login...", false);
            setTimeout(() => { window.location.href = "student-login.html"; }, 2000);

        } catch (err) {
            const errorMessage = err.name === "TypeError" 
                ? "Unable to connect to server. Please check your internet connection." 
                : err.message;
            showAlert(errorMessage, true);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Register as Student";
        }
    });
</script>
</body>
</html>
