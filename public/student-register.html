<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | EduTrust</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent: #dbeafe;
            --bg-gradient: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --error: #ef4444;
            --success: #10b981;
            --focus-ring: rgba(37, 99, 235, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem 1rem;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 680px;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            background: var(--accent);
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            margin-bottom: 0.75rem;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.4rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 1.5rem 0 0.75rem 0;
            padding-bottom: 0.4rem;
            border-bottom: 2px solid var(--accent);
            grid-column: span 2;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
        }

        label span.req {
            color: var(--error);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
            color: var(--text-main);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus, select:focus, textarea:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .toggle-password {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            display: none;
            font-weight: 500;
            line-height: 1.4;
        }

        .alert-error {
            background-color: #fef2f2;
            color: var(--error);
            border: 1px solid #fecaca;
        }

        .alert-success {
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .code-box {
            background: #ffffff;
            border: 2px dashed var(--primary);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 0.75rem;
            text-align: center;
        }

        .code-box strong {
            font-size: 1.4rem;
            color: var(--primary);
            letter-spacing: 2px;
            display: block;
            margin-top: 0.25rem;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 1.75rem;
            padding: 0.95rem;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button[type="submit"]:disabled {
            opacity: 0.7;
            transform: none;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            margin-top: 1.75rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width, .section-title { grid-column: span 1; }
            .card { padding: 1.75rem 1.25rem; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <span class="badge">EduTrust Admission</span>
        <h1>Student Registration</h1>
        <p>Complete the form below to submit your application for review</p>
    </div>

    <div id="alertBox" class="alert" role="alert" aria-live="polite"></div>

    <form id="studentRegisterForm" novalidate>
        <div class="form-grid">
            <!-- School Info Section -->
            <div class="section-title">1. Institution Code</div>
            
            <div class="form-group full-width">
                <label for="school_code">School Code <span class="req">*</span></label>
                <input type="text" id="school_code" required placeholder="Enter School Code (e.g. SCH1024)" style="text-transform: uppercase;">
            </div>

            <!-- Personal Information -->
            <div class="section-title">2. Personal Details</div>

            <div class="form-group">
                <label for="first_name">First Name <span class="req">*</span></label>
                <input type="text" id="first_name" required placeholder="John">
            </div>

            <div class="form-group">
                <label for="last_name">Last Name <span class="req">*</span></label>
                <input type="text" id="last_name" required placeholder="Doe">
            </div>

            <div class="form-group full-width">
                <label for="other_name">Middle / Other Name</label>
                <input type="text" id="other_name" placeholder="Alexander (Optional)">
            </div>

            <div class="form-group">
                <label for="gender">Gender <span class="req">*</span></label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date_of_birth">Date of Birth</label>
                <input type="date" id="date_of_birth">
            </div>

            <!-- Academic Information -->
            <div class="section-title">3. Academic Placement</div>

            <div class="form-group">
                <label for="class_name">Class / Grade <span class="req">*</span></label>
                <select id="class_name" required>
                    <option value="">Select Class</option>
                    <option value="PRM1">Nursery 1</option>
                    <option value="PRM2">Nursery 2</option>
                    <option value="PRM3">Nursery 3</option>
                    <option value="PRM1">Primary 1</option>
                    <option value="PRM2">Primary 2</option>
                    <option value="PRM3">Primary 3</option>
                    <option value="PRM4">Primary 4</option>
                    <option value="PRM5">Primary 5</option>
                    <option value="PRM6">Primary 6</option>
                    <option value="JSS1">JSS 1</option>
                    <option value="JSS2">JSS 2</option>
                    <option value="JSS3">JSS 3</option>
                    <option value="SS1">SS 1</option>
                    <option value="SS2">SS 2</option>
                    <option value="SS3">SS 3</option>
                </select>
            </div>

            <div class="form-group">
                <label for="arm">Stream / Arm</label>
                <input type="text" id="arm" placeholder="e.g. A, B, Gold (Optional)">
            </div>

            <div class="form-group full-width">
                <label for="department">Department (Senior Secondary Only)</label>
                <select id="department">
                    <option value="">Select Department (If SS Class)</option>
                    <option value="SCI">Science</option>
                    <option value="ART">Arts / Humanities</option>
                    <option value="COM">Commercial / Business</option>
                </select>
            </div>

            <!-- Contact & Security -->
            <div class="section-title">4. Account & Contact Information</div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="student@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="+234 800 000 0000">
            </div>

            <div class="form-group full-width">
                <label for="password">Portal Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" minlength="6" placeholder="Create portal login password (Optional)">
                    <button type="button" class="toggle-password" id="togglePassword">Show</button>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="home_address">Home Address</label>
                <textarea id="home_address" placeholder="Enter residential address"></textarea>
            </div>

            <div class="form-group full-width">
                <label for="medical_information">Medical Notes / Allergies</label>
                <textarea id="medical_information" placeholder="List medical conditions, dietary restrictions, or emergency notes (Optional)"></textarea>
            </div>
        </div>

        <button type="submit" id="submitBtn">Submit Student Application</button>
    </form>

    <div class="footer">
        Already registered? <a href="student-login.html">Sign in to Student Portal</a>
    </div>
</div>

<script>
    const form = document.getElementById("studentRegisterForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");
    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("togglePassword");
    const classNameSelect = document.getElementById("class_name");
    const departmentSelect = document.getElementById("department");

    const BASE_URL = "https://edutrust-15ii.onrender.com";

    // Toggle password visibility
    togglePasswordBtn.addEventListener("click", () => {
        const isPassword = passwordInput.getAttribute("type") === "password";
        passwordInput.setAttribute("type", isPassword ? "text" : "password");
        togglePasswordBtn.textContent = isPassword ? "Hide" : "Show";
    });

    // Disable department unless SS class is selected
    classNameSelect.addEventListener("change", (e) => {
        const val = e.target.value;
        if (val.startsWith("SS")) {
            departmentSelect.disabled = false;
        } else {
            departmentSelect.disabled = true;
            departmentSelect.value = "";
        }
    });

    function showAlert(htmlContent, isError = true) {
        alertBox.innerHTML = htmlContent;
        alertBox.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
        alertBox.style.display = 'block';
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        // Collect form data according to controller parameters
        const payload = {
            school_code: document.getElementById("school_code").value.trim().toUpperCase(),
            first_name: document.getElementById("first_name").value.trim(),
            last_name: document.getElementById("last_name").value.trim(),
            other_name: document.getElementById("other_name").value.trim(),
            gender: document.getElementById("gender").value,
            date_of_birth: document.getElementById("date_of_birth").value || null,
            class_name: document.getElementById("class_name").value,
            current_class: document.getElementById("class_name").value,
            arm: document.getElementById("arm").value.trim(),
            department: document.getElementById("department").value,
            email: document.getElementById("email").value.trim().toLowerCase(),
            phone: document.getElementById("phone").value.trim(),
            password: document.getElementById("password").value,
            home_address: document.getElementById("home_address").value.trim(),
            medical_information: document.getElementById("medical_information").value.trim()
        };

        // Client validation check
        if (!payload.school_code) {
            showAlert("School Code is required.", true);
            return;
        }
        if (!payload.first_name || !payload.last_name || !payload.class_name) {
            showAlert("First Name, Last Name, and Class Selection are required.", true);
            return;
        }
        if (payload.password && payload.password.length < 6) {
            showAlert("Password must be at least 6 characters.", true);
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting Application...";

        try {
            const res = await fetch(`${BASE_URL}/api/students/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.message || "Registration failed.");
            }

            // Display success message and generated application tracking code
            const successHtml = `
                <div><strong>Application Submitted Successfully!</strong></div>
                <div>Your registration status is currently <strong>Pending Approval</strong>.</div>
                <div class="code-box">
                    Save your Tracking Code:
                    <strong>${data.registration_code || data.student?.admission_number}</strong>
                </div>
            `;
            showAlert(successHtml, false);
            form.reset();

        } catch (err) {
            const errorMessage = err.name === "TypeError" 
                ? "Network error: Unable to reach EduTrust server. Render service may be waking up." 
                : err.message;
            showAlert(errorMessage, true);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Submit Student Application";
        }
    });
</script>
</body>
</html>
