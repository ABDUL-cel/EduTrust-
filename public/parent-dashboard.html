<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard | EduTrust</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-card-alt: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --border-card: #e2e8f0;
            --topbar-bg: #ffffff;
            --welcome-bg: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 12px 24px -6px rgba(0, 0, 0, 0.12);
        }

        [data-theme="dark"] {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-card-alt: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --border-card: #334155;
            --topbar-bg: #1e293b;
            --welcome-bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
            --shadow-hover: 0 12px 24px -6px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        button {
            font-family: inherit;
        }

        /* --- TOPBAR STYLING --- */
        .topbar {
            min-height: 72px;
            background: var(--topbar-bg);
            border-bottom: 2px solid var(--border-card);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .logo {
            color: #2563eb;
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--text-main);
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Dark Mode Toggle */
        .theme-toggle-btn {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.08);
            border-color: #2563eb;
        }

        .user-profile-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card-alt);
            padding: 6px 14px 6px 8px;
            border-radius: 40px;
            border: 1.5px solid var(--border-color);
        }

        .parent-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--bg-card);
            box-shadow: var(--shadow-sm);
        }

        .parent-avatar-placeholder {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
        }

        .parent-name {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
        }

        .logout {
            border: 0;
            background: #fee2e2;
            color: #dc2626;
            padding: 9px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        [data-theme="dark"] .logout {
            background: rgba(220, 38, 38, 0.2);
            color: #fca5a5;
        }

        .logout:hover {
            background: #ef4444;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* --- LAYOUT --- */
        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 35px 24px 60px;
        }

        .welcome {
            margin-bottom: 30px;
            background: var(--welcome-bg);
            border: 1.5px solid var(--border-color);
            padding: 32px;
            border-radius: 20px;
            color: #ffffff;
            box-shadow: var(--shadow-sm);
        }

        .welcome h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .welcome p {
            margin: 0;
            color: #c7d2fe;
            font-size: 15px;
        }

        .error {
            background: #fef2f2;
            border: 1.5px solid #fecaca;
            color: #991b1b;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
            font-weight: 600;
            font-size: 14px;
        }

        /* --- VISIBLE STATS CARDS --- */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 22px 24px;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            cursor: default;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: #2563eb;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: #cbd5e1;
        }

        .stat-card.children-stat::before { background: #2563eb; }
        .stat-card.active-stat::before { background: #10b981; }
        .stat-card.pending-stat::before { background: #f59e0b; }
        .stat-card.suspended-stat::before { background: #ef4444; }

        .stat-title {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1;
        }

        /* --- SECTIONS --- */
        .section {
            background: var(--bg-card);
            border-radius: 20px;
            border: 2px solid var(--border-color);
            padding: 28px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-sm);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-card);
        }

        .section h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        /* --- VISIBLE CHILDREN CARDS --- */
        .children {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .child-card {
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        .child-card:hover {
            transform: translateY(-6px);
            border-color: #2563eb;
            box-shadow: var(--shadow-hover);
        }

        .child-card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px dashed var(--border-color);
        }

        .child-card h3 {
            margin: 0;
            font-size: 17px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.3;
        }

        .child-passport {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2563eb;
            flex-shrink: 0;
        }

        .child-placeholder {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--bg-card-alt);
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            flex-shrink: 0;
            border: 2px solid #2563eb;
        }

        .child-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin: 8px 0;
            font-size: 13.5px;
        }

        .child-row span:first-child {
            color: var(--text-muted);
            font-weight: 500;
        }

        .child-row strong {
            text-align: right;
            color: var(--text-main);
            font-weight: 700;
        }

        .child-actions {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-card);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13.5px;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-card-alt);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: #2563eb;
            transform: translateY(-1px);
        }

        /* --- STATUS BADGES --- */
        .status {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 30px;
            background: #ecfdf5;
            color: #047857;
            font-size: 12px;
            font-weight: 700;
        }

        .status.pending { background: #fffbeb; color: #b45309; }
        .status.suspended { background: #fef2f2; color: #b91c1c; }
        .status.graduated { background: #eff6ff; color: #1d4ed8; }
        .status.archived { background: var(--bg-card-alt); color: var(--text-muted); }

        /* --- PROFILE GRID --- */
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .profile-item {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            background: var(--bg-card-alt);
        }

        .profile-item:hover {
            transform: translateY(-3px);
            border-color: #2563eb;
            box-shadow: var(--shadow-sm);
        }

        .profile-label {
            display: block;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .profile-value {
            font-weight: 700;
            color: var(--text-main);
            font-size: 15px;
            word-break: break-word;
        }

        .school-card {
            background: var(--bg-card-alt);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            color: var(--text-main);
        }

        .school-card:hover {
            transform: translateY(-3px);
            border-color: #2563eb;
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 992px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .children { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 640px) {
            .topbar { padding: 0 16px; }
            .parent-name { display: none; }
            .user-profile-badge { padding: 4px; background: transparent; border: none; }
            .container { padding: 20px 16px 40px; }
            .welcome { padding: 24px; border-radius: 16px; }
            .stats, .children, .profile-grid { grid-template-columns: 1fr; }
            .section { padding: 20px; border-radius: 16px; }
        }
    </style>
</head>

<body>

<header class="topbar">

    <a href="/" class="logo">
        Edu<span>Trust</span>
    </a>

    <div class="top-right">

        <!-- Theme Switcher Button -->
        <button class="theme-toggle-btn" id="themeToggleBtn" type="button" title="Toggle Light/Dark Mode">
            <svg id="sunIcon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display:none;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg id="moonIcon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>

        <div class="user-profile-badge">
            <div id="parentAvatarContainer">
                <div class="parent-avatar-placeholder" id="parentInitials">--</div>
            </div>
            <span id="parentName" class="parent-name">
                Loading...
            </span>
        </div>

        <button class="logout" id="logoutButton" type="button">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Logout
        </button>

    </div>

</header>


<main class="container">

    <section class="welcome">
        <h1 id="welcomeTitle">Parent Dashboard</h1>
        <p>Manage your children and monitor their academic progress from one place.</p>
    </section>

    <div id="error" class="error"></div>

    <section class="stats">
        <div class="stat-card children-stat">
            <div class="stat-title">Total Children</div>
            <div class="stat-value" id="childrenCount">0</div>
        </div>

        <div class="stat-card active-stat">
            <div class="stat-title">Active</div>
            <div class="stat-value" id="activeCount">0</div>
        </div>

        <div class="stat-card pending-stat">
            <div class="stat-title">Pending</div>
            <div class="stat-value" id="pendingCount">0</div>
        </div>

        <div class="stat-card suspended-stat">
            <div class="stat-title">Suspended</div>
            <div class="stat-value" id="suspendedCount">0</div>
        </div>
    </section>

    <section class="section">
        <div class="section-header">
            <h2>My Children</h2>
        </div>
        <div id="children" class="children">
            <div style="color:var(--text-muted); font-weight:600;">Loading children...</div>
        </div>
    </section>

    <section class="section">
        <div class="section-header">
            <h2>Parent Profile</h2>
        </div>
        <div id="profile" class="profile-grid">
            <div style="color:var(--text-muted); font-weight:600;">Loading profile...</div>
        </div>
    </section>

    <section class="section">
        <div class="section-header">
            <h2>School Connection</h2>
        </div>
        <div id="schoolInfo" class="school-info">
            Loading school information...
        </div>
    </section>

</main>


<script>

(function () {

    "use strict";

    // =========================================================
    // DARK MODE MANAGEMENT
    // =========================================================

    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const sunIcon = document.getElementById("sunIcon");
    const moonIcon = document.getElementById("moonIcon");

    const savedTheme = localStorage.getItem("edutrust_theme") || "light";
    setTheme(savedTheme);

    themeToggleBtn.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        setTheme(currentTheme);
    });

    function setTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("edutrust_theme", theme);
        if (theme === "dark") {
            sunIcon.style.display = "block";
            moonIcon.style.display = "none";
        } else {
            sunIcon.style.display = "none";
            moonIcon.style.display = "block";
        }
    }

    // =========================================================
    // CONFIGURATION & API
    // =========================================================

    const API_BASE =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
            ? "http://localhost:5000/api"
            : "https://edutrust-15ii.onrender.com/api";

    const DASHBOARD_URL = `${API_BASE}/parents/dashboard`;

    // =========================================================
    // ELEMENTS
    // =========================================================

    const parentName = document.getElementById("parentName");
    const parentAvatarContainer = document.getElementById("parentAvatarContainer");
    const welcomeTitle = document.getElementById("welcomeTitle");
    const childrenCount = document.getElementById("childrenCount");
    const activeCount = document.getElementById("activeCount");
    const pendingCount = document.getElementById("pendingCount");
    const suspendedCount = document.getElementById("suspendedCount");
    const childrenContainer = document.getElementById("children");
    const profileContainer = document.getElementById("profile");
    const schoolInfo = document.getElementById("schoolInfo");
    const errorContainer = document.getElementById("error");
    const logoutButton = document.getElementById("logoutButton");

    // =========================================================
    // TOKEN
    // =========================================================

    const token =
        localStorage.getItem("parent_token") ||
        localStorage.getItem("edutrust_token") ||
        localStorage.getItem("token");

    if (!token) {
        window.location.href = "parent-login.html";
        return;
    }

    // LOGOUT
    logoutButton.addEventListener("click", function () {
        localStorage.removeItem("parent_token");
        localStorage.removeItem("edutrust_token");
        localStorage.removeItem("token");
        window.location.href = "parent-login.html";
    });

    // HELPERS
    function showError(message) {
        errorContainer.textContent = message || "Something went wrong.";
        errorContainer.style.display = "block";
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatDate(value) {
        if (!value) return "-";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "-";
        return date.toLocaleDateString("en-NG", {
            year: "numeric",
            month: "short",
            day: "numeric"
        });
    }

    function getStatusClass(status) {
        switch (status) {
            case "Pending": return "pending";
            case "Suspended": return "suspended";
            case "Graduated": return "graduated";
            case "Archived": return "archived";
            default: return "";
        }
    }

    function getInitials(name) {
        const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return "?";
        if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    // RENDER FUNCTIONS
    function renderParentAvatar(parent) {
        const name = parent.fullName || "Parent";
        const passport = parent.passport || parent.profilePicture || parent.avatar;

        if (passport) {
            parentAvatarContainer.innerHTML = `
                <img class="parent-avatar" src="${escapeHtml(passport)}" alt="${escapeHtml(name)}" onerror="this.outerHTML='<div class=\\'parent-avatar-placeholder\\'>${escapeHtml(getInitials(name))}</div>';">
            `;
        } else {
            parentAvatarContainer.innerHTML = `
                <div class="parent-avatar-placeholder">${escapeHtml(getInitials(name))}</div>
            `;
        }
    }

    function renderChildren(children) {
        if (!Array.isArray(children) || children.length === 0) {
            childrenContainer.innerHTML = `<div style="color:var(--text-muted); padding:20px 0;">No children linked to this parent account.</div>`;
            return;
        }

        childrenContainer.innerHTML = children.map(function (child) {
            const name = child.fullName || [child.first_name, child.other_name, child.last_name].filter(Boolean).join(" ") || "Unnamed Student";
            const status = child.status || "Pending";
            const statusClass = getStatusClass(status);
            const passport = child.passport;
            const childId = child._id || child.id || "";
            const admissionNo = child.admissionNumber || "";

            const avatar = passport
                ? `<img class="child-passport" loading="lazy" src="${escapeHtml(passport)}" alt="${escapeHtml(name)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                   <div class="child-placeholder" style="display:none;">${escapeHtml(getInitials(name))}</div>`
                : `<div class="child-placeholder">${escapeHtml(getInitials(name))}</div>`;

            return `
                <article class="child-card">
                    <div class="child-card-header">
                        ${avatar}
                        <div>
                            <h3>${escapeHtml(name)}</h3>
                            <span class="status ${statusClass}" style="margin-top: 5px;">${escapeHtml(status)}</span>
                        </div>
                    </div>

                    <div class="child-row"><span>Admission No.</span><strong>${escapeHtml(admissionNo || "-")}</strong></div>
                    <div class="child-row"><span>Class</span><strong>${escapeHtml(child.className || "-")}</strong></div>
                    <div class="child-row"><span>Arm</span><strong>${escapeHtml(child.arm || "-")}</strong></div>
                    <div class="child-row"><span>Gender</span><strong>${escapeHtml(child.gender || "-")}</strong></div>
                    <div class="child-row"><span>Date of Birth</span><strong>${escapeHtml(formatDate(child.dateOfBirth))}</strong></div>
                    <div class="child-row"><span>Admission Date</span><strong>${escapeHtml(formatDate(child.admissionDate))}</strong></div>

                    <div class="child-actions">
                        <a href="check-result.html?studentId=${encodeURIComponent(childId)}&admissionNo=${encodeURIComponent(admissionNo)}" class="btn-action btn-primary">Check Exam Result</a>
                        <a href="report-card.html?studentId=${encodeURIComponent(childId)}" class="btn-action btn-secondary">View Report Sheet</a>
                    </div>
                </article>
            `;
        }).join("");
    }

    function renderProfile(parent) {
        profileContainer.innerHTML = `
            <div class="profile-item"><span class="profile-label">Full Name</span><div class="profile-value">${escapeHtml(parent.fullName || "-")}</div></div>
            <div class="profile-item"><span class="profile-label">Relationship</span><div class="profile-value">${escapeHtml(parent.relationship || "-")}</div></div>
            <div class="profile-item"><span class="profile-label">Phone</span><div class="profile-value">${escapeHtml(parent.phone || "-")}</div></div>
            <div class="profile-item"><span class="profile-label">Alternate Phone</span><div class="profile-value">${escapeHtml(parent.alternatePhone || "-")}</div></div>
            <div class="profile-item"><span class="profile-label">Email</span><div class="profile-value">${escapeHtml(parent.email || "-")}</div></div>
            <div class="profile-item"><span class="profile-label">Occupation</span><div class="profile-value">${escapeHtml(parent.occupation || "-")}</div></div>
            <div class="profile-item"><span class="profile-label">Home Address</span><div class="profile-value">${escapeHtml(parent.homeAddress || "-")}</div></div>
            <div class="profile-item"><span class="profile-label">Account Status</span><div class="profile-value"><span class="status ${getStatusClass(parent.status)}">${escapeHtml(parent.status || "-")}</span></div></div>
        `;
    }

    function renderSchool(parent) {
        schoolInfo.innerHTML = `
            <div class="school-card">
                Your parent account is officially connected to School ID: <strong>${escapeHtml(parent.schoolId || "-")}</strong>
            </div>
        `;
    }

    // LOAD DASHBOARD
    async function loadDashboard() {
        errorContainer.style.display = "none";

        try {
            const response = await fetch(DASHBOARD_URL, {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                }
            });

            let data = null;
            try {
                data = await response.json();
            } catch (jsonError) {
                throw new Error("Server returned an invalid response.");
            }

            if (response.status === 401 || response.status === 403) {
                localStorage.removeItem("parent_token");
                localStorage.removeItem("edutrust_token");
                localStorage.removeItem("token");
                window.location.href = "parent-login.html";
                return;
            }

            if (!response.ok) throw new Error(data?.message || "Unable to load parent dashboard.");
            if (!data || !data.success || !data.dashboard) throw new Error("Parent dashboard data was not returned.");

            const dashboard = data.dashboard;
            const parent = dashboard.parent || {};
            const statistics = dashboard.statistics || {};
            const children = Array.isArray(dashboard.children) ? dashboard.children : [];

            const name = parent.fullName || "Parent";
            parentName.textContent = name;
            welcomeTitle.textContent = `Welcome back, ${name}`;

            renderParentAvatar(parent);

            childrenCount.textContent = Number(statistics.totalChildren || 0);
            activeCount.textContent = Number(statistics.activeChildren || 0);
            pendingCount.textContent = Number(statistics.pendingChildren || 0);
            suspendedCount.textContent = Number(statistics.suspendedChildren || 0);

            renderChildren(children);
            renderProfile(parent);
            renderSchool(parent);

        } catch (error) {
            console.error("PARENT DASHBOARD ERROR:", error);
            showError(error.message || "Failed to load parent dashboard.");
        }
    }

    loadDashboard();

})();
</script>
