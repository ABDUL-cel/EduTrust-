<!-- public/parent-dashboard.html -->
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
<link rel="icon" type="image/png" href="/logo-icon.png">
    <title>Parent Dashboard - EduTrust</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .topbar {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .logo {
            color: #1769e0;
            font-size: 23px;
            font-weight: 800;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .parent-name {
            font-weight: 700;
        }

        .logout {
            border: 0;
            background: #ef4444;
            color: white;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
        }

        .container {
            max-width: 1150px;
            margin: 35px auto;
            padding: 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin-bottom: 5px;
        }

        .welcome p {
            color: #667085;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            border: 1px solid #e5e7eb;
        }

        .stat-title {
            color: #667085;
            font-size: 13px;
        }

        .stat-value {
            margin-top: 8px;
            font-size: 28px;
            font-weight: 800;
        }

        .section {
            background: white;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            padding: 25px;
            margin-bottom: 25px;
        }

        .section h2 {
            margin-top: 0;
        }

        .children {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;
        }

        .child-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
        }

        .child-card h3 {
            margin-top: 0;
        }

        .child-row {
            display: flex;
            justify-content: space-between;
            margin: 9px 0;
            font-size: 14px;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            background: #e8f7ee;
            color: #18794e;
            font-size: 12px;
            font-weight: 700;
        }

        .empty {
            color: #667085;
            padding: 20px 0;
        }

        .error {
            background: #fff0f0;
            color: #b42318;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        @media(max-width:900px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .children {
                grid-template-columns:
                    1fr 1fr;
            }

        }

        @media(max-width:600px) {

            .stats,
            .children {
                grid-template-columns: 1fr;
            }

            .topbar {
                padding: 0 15px;
            }

            .parent-name {
                display: none;
            }

        }

    </style>

</head>


<body>

<header class="topbar">

    <div class="logo">
        EduTrust
    </div>

    <div class="top-right">

        <span
            id="parentName"
            class="parent-name"
        >
            Loading...
        </span>

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<main class="container">

    <section class="welcome">

        <h1>
            Parent Dashboard
        </h1>

        <p>
            Manage your children and monitor their school
            information from one place.
        </p>

    </section>


    <div
        id="error"
        class="error"
    ></div>


    <section class="stats">

        <div class="stat-card">

            <div class="stat-title">
                Children
            </div>

            <div
                class="stat-value"
                id="childrenCount"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Active
            </div>

            <div
                class="stat-value"
                id="activeCount"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Pending
            </div>

            <div
                class="stat-value"
                id="pendingCount"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Suspended
            </div>

            <div
                class="stat-value"
                id="suspendedCount"
            >
                0
            </div>

        </div>

    </section>


    <section class="section">

        <h2>
            My Children
        </h2>

        <div
            id="children"
            class="children"
        >

            <div class="empty">
                Loading children...
            </div>

        </div>

    </section>


    <section class="section">

        <h2>
            Parent Information
        </h2>

        <div id="profile">

            Loading profile...

        </div>

    </section>

</main>


<script>

const token =
    localStorage.getItem(
        "edutrust_token"
    );


if (!token) {

    window.location.href =
        "/parent/login";

}


async function loadDashboard() {

    try {

        const response =
            await fetch(
                "/parent/dashboard",
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load parent dashboard."
            );

        }


        const dashboard =
            data.dashboard;


        document.getElementById(
            "parentName"
        ).textContent =
            dashboard.parent.fullName;


        document.getElementById(
            "childrenCount"
        ).textContent =
            dashboard.statistics.totalChildren;


        document.getElementById(
            "activeCount"
        ).textContent =
            dashboard.statistics.activeChildren;


        document.getElementById(
            "pendingCount"
        ).textContent =
            dashboard.statistics.pendingChildren;


        document.getElementById(
            "suspendedCount"
        ).textContent =
            dashboard.statistics.suspendedChildren;


        renderChildren(
            dashboard.children
        );


        renderProfile(
            dashboard.parent
        );


    } catch (error) {

        showError(
            error.message
        );

    }

}


function renderChildren(children) {

    const container =
        document.getElementById(
            "children"
        );


    if (!children ||
        children.length === 0) {

        container.innerHTML =
            `<div class="empty">
                No children are currently linked
                to this parent account.
             </div>`;

        return;

    }


    container.innerHTML =
        children.map(
            child => `

                <div class="child-card">

                    <h3>
                        ${escapeHtml(
                            child.fullName
                        )}
                    </h3>

                    <div class="child-row">
                        <span>
                            Admission No.
                        </span>

                        <strong>
                            ${escapeHtml(
                                child.admissionNumber ||
                                "-"
                            )}
                        </strong>
                    </div>

                    <div class="child-row">
                        <span>
                            Class
                        </span>

                        <strong>
                            ${escapeHtml(
                                child.className ||
                                "-"
                            )}
                        </strong>
                    </div>

                    <div class="child-row">
                        <span>
                            Arm
                        </span>

                        <strong>
                            ${escapeHtml(
                                child.arm ||
                                "-"
                            )}
                        </strong>
                    </div>

                    <div class="child-row">
                        <span>
                            Status
                        </span>

                        <span class="status">
                            ${escapeHtml(
                                child.status
                            )}
                        </span>
                    </div>

                </div>

            `
        )
        .join("");

}


function renderProfile(parent) {

    document.getElementById(
        "profile"
    ).innerHTML = `

        <p>
            <strong>Name:</strong>
            ${escapeHtml(parent.fullName)}
        </p>

        <p>
            <strong>Relationship:</strong>
            ${escapeHtml(
                parent.relationship || "-"
            )}
        </p>

        <p>
            <strong>Phone:</strong>
            ${escapeHtml(
                parent.phone || "-"
            )}
        </p>

        <p>
            <strong>Email:</strong>
            ${escapeHtml(
                parent.email || "-"
            )}
        </p>

        <p>
            <strong>Occupation:</strong>
            ${escapeHtml(
                parent.occupation || "-"
            )}
        </p>

        <p>
            <strong>Address:</strong>
            ${escapeHtml(
                parent.homeAddress || "-"
            )}
        </p>

    `;

}


function showError(message) {

    const error =
        document.getElementById(
            "error"
        );

    error.textContent =
        message;

    error.style.display =
        "block";

}


function logout() {

    localStorage.removeItem(
        "edutrust_token"
    );

    window.location.href =
        "/";

}


function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


loadDashboard();

</script>

</body>
</html>
