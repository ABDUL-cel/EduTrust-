<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Login | EduTrust</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            color: #1769e0;
            font-size: 26px;
            font-weight: 800;
            text-decoration: none;
        }

        .logo span {
            color: #172033;
        }

        .login-card h2 {
            margin: 15px 0 5px;
            font-size: 22px;
            text-align: center;
        }

        .login-card p {
            margin: 0 0 25px;
            color: #667085;
            font-size: 14px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #344054;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #1769e0;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #1769e0;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #1355b8;
        }

        .btn-submit:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        .alert-message {
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-error {
            background: #fff0f0;
            border: 1px solid #f5b5b5;
            color: #b42318;
        }

        .alert-success {
            background: #e8f7ee;
            border: 1px solid #a6e5bd;
            color: #18794e;
        }

        .footer-links {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: #667085;
        }

        .footer-links a {
            color: #1769e0;
            text-decoration: none;
            font-weight: 700;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<main class="login-card">
    <div class="logo-container">
        <a href="index.html" class="logo">
            Edu<span>Trust</span>
        </a>
        <h2>Parent Portal Login</h2>
        <p>Enter your credentials to access your dashboard</p>
    </div>

    <div id="alertBox" class="alert-message"></div>

    <form id="loginForm" novalidate>
        <div class="form-group">
            <label for="identity">Email or Phone Number</label>
            <input 
                type="text" 
                id="identity" 
                name="identity" 
                placeholder="e.g. parent@example.com or 08012345678" 
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="••••••••" 
                required
            >
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
    </form>

    <div class="footer-links">
        Don't have an account? <a href="parent-register.html">Register Parent</a>
    </div>
</main>

<script>
(function () {
    "use strict";

    const API_BASE =
        window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
            ? "http://localhost:5000/api"
            : "https://edutrust-15ii.onrender.com/api";

    const LOGIN_URL = `${API_BASE}/parents/login`;

    const loginForm = document.getElementById("loginForm");
    const identityInput = document.getElementById("identity");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const alertBox = document.getElementById("alertBox");

    function showAlert(message, isSuccess = false) {
        alertBox.textContent = message;
        alertBox.className = `alert-message ${isSuccess ? 'alert-success' : 'alert-error'}`;
        alertBox.style.display = "block";
    }

    function hideAlert() {
        alertBox.style.display = "none";
    }

    function clearOldTokens() {
        localStorage.removeItem("parent_token");
        localStorage.removeItem("edutrust_token");
        localStorage.removeItem("token");
        sessionStorage.removeItem("parent_token");
        sessionStorage.removeItem("edutrust_token");
        sessionStorage.removeItem("token");
    }

    loginForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        hideAlert();

        const identity = identityInput.value.trim();
        const password = passwordInput.value;

        if (!identity || !password) {
            showAlert("Please enter both email/phone and password.");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Authenticating...";

        try {
            const response = await fetch(LOGIN_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    emailOrPhone: identity,
                    identity: identity,
                    email: identity,
                    phone: identity,
                    password: password
                })
            });

            let data = null;
            try {
                data = await response.json();
            } catch (err) {
                throw new Error("Server returned an invalid response.");
            }

            if (!response.ok || !data.success) {
                throw new Error(data?.message || "Invalid credentials. Please try again.");
            }

            // Extract string token safely
            let token = data.token || data.accessToken || data.jwt;

            if (typeof token === "object" && token !== null) {
                token = token.token || token.accessToken;
            }

            if (!token || typeof token !== "string") {
                throw new Error("Authentication succeeded, but no valid token was returned.");
            }

            // Clear residual sessions from other accounts
            clearOldTokens();

            // Store clean raw string token
            localStorage.setItem("parent_token", token);
            localStorage.setItem("edutrust_token", token);

            showAlert("Login successful! Redirecting to dashboard...", true);

            setTimeout(() => {
                window.location.href = "parent-dashboard.html";
            }, 1000);

        } catch (error) {
            console.error("LOGIN ERROR:", error);
            showAlert(error.message || "Failed to connect to server.");
            submitBtn.disabled = false;
            submitBtn.textContent = "Sign In";
        }
    });
})();
</script>

</body>
</html>
