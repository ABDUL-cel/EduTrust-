<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduTrust - Register Parent</title>
<link rel="icon" type="image/png" href="logo-icon.png">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

<div class="page-content">

    <div class="page-introduction">
        <div>
            <h2>Register Parent / Guardian</h2>
            <p>
                Add a parent or guardian to your school's EduTrust records.
            </p>
        </div>

        <button
            type="button"
            class="secondary-button"
            onclick="window.history.back()"
        >
            ← Back
        </button>
    </div>


    <!-- ================================
         REGISTRATION CARD
    ================================= -->

    <div class="dashboard-card">

        <form id="parentRegistrationForm">

            <!-- NAME -->

            <div class="form-row">

                <div class="form-group">
                    <label for="first_name">
                        First Name <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        placeholder="Enter first name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="last_name">
                        Last Name <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                        placeholder="Enter last name"
                        required
                    >
                </div>

            </div>


            <!-- OTHER NAME + RELATIONSHIP -->

            <div class="form-row">

                <div class="form-group">
                    <label for="other_name">
                        Other Name
                    </label>

                    <input
                        type="text"
                        id="other_name"
                        name="other_name"
                        placeholder="Enter other name"
                    >
                </div>


                <div class="form-group">
                    <label for="relationship">
                        Relationship <span>*</span>
                    </label>

                    <select
                        id="relationship"
                        name="relationship"
                        required
                    >
                        <option value="">
                            Select relationship
                        </option>

                        <option value="Father">
                            Father
                        </option>

                        <option value="Mother">
                            Mother
                        </option>

                        <option value="Guardian">
                            Guardian
                        </option>

                        <option value="Uncle">
                            Uncle
                        </option>

                        <option value="Aunt">
                            Aunt
                        </option>

                        <option value="Grandfather">
                            Grandfather
                        </option>

                        <option value="Grandmother">
                            Grandmother
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>
                </div>

            </div>


            <!-- CONTACT -->

            <div class="form-row">

                <div class="form-group">

                    <label for="phone">
                        Phone Number <span>*</span>
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="08012345678"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="alternate_phone">
                        Alternate Phone
                    </label>

                    <input
                        type="tel"
                        id="alternate_phone"
                        name="alternate_phone"
                        placeholder="Optional phone number"
                    >

                </div>

            </div>


            <!-- EMAIL -->

            <div class="form-row">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="parent@example.com"
                    >

                </div>


                <div class="form-group">

                    <label for="occupation">
                        Occupation
                    </label>

                    <input
                        type="text"
                        id="occupation"
                        name="occupation"
                        placeholder="Enter occupation"
                    >

                </div>

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label for="home_address">
                    Home Address
                </label>

                <textarea
                    id="home_address"
                    name="home_address"
                    rows="3"
                    placeholder="Enter residential address"
                ></textarea>

            </div>


            <!-- PASSPORT -->

            <div class="form-group">

                <label for="passport">
                    Passport / Profile Image URL
                </label>

                <input
                    type="text"
                    id="passport"
                    name="passport"
                    placeholder="Paste image URL or leave blank"
                >

            </div>


            <!-- MESSAGE -->

            <div
                id="parentMessage"
                style="
                    display:none;
                    margin-top:15px;
                    padding:12px;
                    border-radius:8px;
                "
            ></div>


            <!-- ACTIONS -->

            <div
                class="modal-actions"
                style="margin-top:25px;"
            >

                <button
                    type="button"
                    class="cancel-button"
                    onclick="window.history.back()"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="primary-button"
                    id="registerParentButton"
                >
                    Register Parent
                </button>

            </div>

        </form>

    </div>

</div>


<script src="parent-registration.js"></script>

</body>
</html>
