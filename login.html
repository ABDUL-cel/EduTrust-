<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | EduTrust</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>


    <main class="login-page">


        <section class="login-container">


            <div class="login-intro">


                <a href="index.html" class="logo">
                    Edu<span>Trust</span>
                </a>


                <div class="intro-content">


                    <div class="intro-icon">
                        🤝
                    </div>


                    <h1>
                        Welcome Back.
                    </h1>


                    <p>
                        Continue building trust between
                        your school and parents.
                    </p>


                    <div class="trust-points">

                        <p>✓ Clear fee records</p>

                        <p>✓ Better school management</p>

                        <p>✓ Stronger parent trust</p>

                    </div>


                </div>


            </div>


            <div class="login-form-container">


                <div class="form-heading">


                    <h2>
                        Welcome Back
                    </h2>


                    <p>
                        Login to your EduTrust account.
                    </p>


                </div>


                <form id="loginForm">


                    <div class="form-group">


                        <label for="email">
                            Email Address
                        </label>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required
                        >


                    </div>


                    <div class="form-group">


                        <label for="password">
                            Password
                        </label>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >


                    </div>


                    <div class="form-options">


                        <label class="remember-me">


                            <input
                                type="checkbox"
                            >


                            Remember me


                        </label>


                        <a href="#">
                            Forgot Password?
                        </a>


                    </div>

                  <p id="message"></p>
                    <button
                        type="submit"
                        class="login-button"
                    >

                        Login to EduTrust

                    </button>


                </form>


                <div class="register-link">


                    <p>
                        Don't have an account?
                        <a href="register.html">
                            Create a School Account
                        </a>
                    </p>


                </div>


            </div>


        </section>


    </main>
    <script src="login.js"></script>

</body>

</html>
