<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Your School | EduTrust</title>

    <link rel="stylesheet" href="register.css">

</head>


<body>


    <main class="register-page">


        <section class="register-container">


            <div class="register-intro">

                <a href="index.html" class="logo">
                    Edu<span>Trust</span>
                </a>


                <h1>
                    Build Trust.
                    Manage Better.
                </h1>


                <p>
                    Create your school's EduTrust account
                    and take the first step toward simpler,
                    clearer school fee management.
                </p>


                <div class="register-benefits">

                    <p>✓ Manage school fee records</p>

                    <p>✓ Improve parent transparency</p>

                    <p>✓ Keep your school organized</p>

                </div>

            </div>


            <div class="register-form-container">


                <div class="form-heading">

                    <h2>
                        Create Your School Account
                    </h2>

                    <p>
                        Already have an account?
                        <a href="login.html">
                            Login
                        </a>
                    </p>

                </div>


                <form>


                    <div class="form-group">

                        <label for="school-name">
                            School Name
                        </label>

                        <input
                            type="text"
                            id="school-name"
                            name="school-name"
                            placeholder="Enter your school name"
                            required
                        >

                    </div>


                    <div class="form-row">


                        <div class="form-group">

                            <label for="owner-name">
                                Owner / Admin Name
                            </label>

                            <input
                                type="text"
                                id="owner-name"
                                name="owner-name"
                                placeholder="Your full name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="08012345678"
                                required
                            >

                        </div>


                    </div>


                    <div class="form-group">

                        <label for="email">
                            School Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="school@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="address">
                            School Address
                        </label>

                        <input
                            type="text"
                            id="address"
                            name="address"
                            placeholder="Enter your school address"
                            required
                        >

                    </div>


                    <div class="form-row">


                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="confirm-password">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="confirm-password"
                                name="confirm-password"
                                placeholder="Confirm password"
                                required
                            >

                        </div>


                    </div>


                    <label class="terms">

                        <input
                            type="checkbox"
                            required
                        >

                        <span>
                            I agree to the EduTrust
                            <a href="#">
                                Terms & Conditions
                            </a>
                        </span>

                    </label>


                    <button
                        type="submit"
                        class="register-button"
                    >

                        Create School Account

                    </button>


                </form>


            </div>


        </section>


    </main>

<script src="register.js"></script>
</body>

</html>
