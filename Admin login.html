<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | EduTrust</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <a href="../index.html" class="logo">Edu<span>Trust</span></a>
            <h2>School Admin Login</h2>
            <form>
                <div class="form-group">
                    <label>School Email</label>
                    <input type="email" placeholder="admin@school.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="primary-button" style="width: 100%;">
                    Login
                </button>
            </form>
        </div>
    </div>
</body>
</html>
