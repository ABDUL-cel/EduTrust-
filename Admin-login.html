<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | EduTrust</title>
    <link rel="stylesheet" href="home.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #EFF6FF 0%, #FFFFFF 100%);
        }
        .login-box {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(30, 64, 175, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-box h2 { text-align: center; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-group input:focus { border-color: #3B82F6; outline: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <a href="../index.html" class="logo">Edu<span>Trust</span></a>
            <h2>School Admin Login</h2>
            <form>
                <div class="form-group">
                    <label>School Email</label>
                    <input type="email" placeholder="admin@school.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="primary-button" style="width: 100%;">
                    Login
                </button>
            </form>
        </div>
    </div>
</body>
</html>
